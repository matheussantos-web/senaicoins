<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Testes - API FreeOnlineStorage</title>

    <!-- IMPORTAÇÃO DO VUE.JS 3 VIA CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-get {
            background-color: #007BFF;
        }

        .btn-post {
            background-color: #28a745;
        }

        .btn-admin {
            background-color: #dc3545;
        }

        input {
            padding: 6px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

    <!-- Onde o Vue vai "morar" -->
    <div id="app" class="container">
        <h2>🎮 Painel de Testes: API FreeOnlineStorage</h2>
        <p><strong>Bucket:</strong> senai | <strong>Chave:</strong> coins</p>

        <hr style="margin: 20px 0;">

        <!-- EXIBIÇÃO DAS MOEDAS (GET) -->
        <div>
            <h3>📊 Saldo Atual dos Integrantes (GET)</h3>
            <button @click="buscarMoedas" class="btn-get">Atualizar Tela (GET)</button>
            <pre>{{ moedas }}</pre>
        </div>

        <hr style="margin: 20px 0;">

        <!-- ATUALIZAÇÃO DE MOEDAS (POST)
        <div>
            <h3>⚙️ Modificar Moedas (POST)</h3>
            <div style="margin-bottom: 10px;">
                <label>Nome: </label>
                <input v-model="nomeAluno" type="text" placeholder="Ex: Ana">
            </div>
            <div style="margin-bottom: 10px;">
                <label>Qtd a somar: </label>
                <input v-model.number="quantidade" type="number">
            </div>
            <button @click="atualizarMoedas" class="btn-post">Adicionar Pontos (POST)</button>
        </div> -->

        <!-- ÁREA RESTRITA DO PROFESSOR (ALTERAR COM SENHA / ADMIN AUTH) -->
        <div style="margin-top: 20px; border-top: 2px solid #dc3545; padding-top: 15px; background: #fff8f8; padding: 15px; border-radius: 6px;">
            <h3 style="color: #dc3545;">🔒 Área Restrita (Alteração de Pontos - Admin)</h3>
            <div style="margin-bottom: 10px;">
                <label>Senha Admin: </label>
                <input v-model="adminAuth" type="password" placeholder="Digite a senha do .env">
            </div>
            <div style="margin-bottom: 10px;">
                <label>Nome: </label>
                <input v-model="nomeAlunoAlterar" type="text" placeholder="Ex: Ana">
            </div>
            <div style="margin-bottom: 10px;">
                <label>Novo Valor Exato: </label>
                <input v-model.number="valorExato" type="number" placeholder="Ex: 500">
            </div>
            <button @click="alterarPontosDireto" class="btn-admin">Definir Valor Exato (Admin)</button>
        </div>

        <!-- Feedback -->
        <p v-if="mensagem" style="margin-top: 20px; font-weight: bold; color: #333;">{{ mensagem }}</p>
    </div>

    <!-- SCRIPT DA APLICAÇÃO VUE -->
    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            setup() {
                const baseUrl = "https://onlinestorage.you.tec.br/api"
                const bucket = "senai"
                const key = "coins"

                const moedas = ref({})
                const nomeAluno = ref("")
                const quantidade = ref(0)
                const mensagem = ref("")
                
                // Variáveis da Área Restrita
                const nomeAlunoAlterar = ref("")
                const valorExato = ref(0)
                const adminAuth = ref("") // Guarda a senha digitada

                // 1. FUNÇÃO GET COM HEADERS
                async function buscarMoedas() {
                    try {
                        const resposta = await fetch(`${baseUrl}/getkey/${bucket}/${key}`, {
                            method: "GET",
                            headers: { "Accept": "application/json" }
                        })

                        if (!resposta.ok) {
                            moedas.value = {}
                            mensagem.value = "Nenhum dado encontrado ainda."
                            return
                        }
                        const dados = await resposta.json()
                        moedas.value = dados.value || {}
                        mensagem.value = "Dados atualizados com sucesso via GET!"
                    } catch (erro) {
                        console.error("Erro no GET:", erro)
                        mensagem.value = "Erro ao buscar dados da API."
                    }
                }

                // 2. FUNÇÃO POST PARA ADICIONAR (SOMAR)
                async function atualizarMoedas() {
                    if (!nomeAluno.value) {
                        alert("Digite o nome do aluno!")
                        return
                    }

                    let dadosAtuais = { ...moedas.value }
                    let saldoAtual = Number(dadosAtuais[nomeAluno.value]) || 0
                    dadosAtuais[nomeAluno.value] = saldoAtual + Number(quantidade.value)

                    try {
                        const resposta = await fetch(`${baseUrl}/`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json"
                            },
                            body: JSON.stringify({
                                bucket: bucket,
                                key: key,
                                value: dadosAtuais
                            })
                        })

                        if (resposta.ok) {
                            mensagem.value = `Sucesso! Adicionado ${quantidade.value} para ${nomeAluno.value} via POST.`
                            await buscarMoedas()
                        } else {
                            mensagem.value = "Erro ao salvar na API."
                        }
                    } catch (erro) {
                        console.error("Erro no POST:", erro)
                        mensagem.value = "Erro de conexão ao salvar."
                    }
                }

                // 3. FUNÇÃO POST PROTEGIDA COM ADMIN-AUTH
                async function alterarPontosDireto() {
                    if (!adminAuth.value) {
                        alert("Acesso negado! Digite a senha de Administrador.")
                        return
                    }
                    if (!nomeAlunoAlterar.value) {
                        alert("Digite o nome do aluno!")
                        return
                    }

                    let dadosAtuais = { ...moedas.value }
                    dadosAtuais[nomeAlunoAlterar.value] = Number(valorExato.value)

                    try {
                        const resposta = await fetch(`${baseUrl}/`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json",
                                "admin-auth": adminAuth.value // Enviando a senha no header exigido pela API
                            },
                            body: JSON.stringify({
                                bucket: bucket,
                                key: key,
                                value: dadosAtuais
                            })
                        })

                        if (resposta.ok) {
                            mensagem.value = `Sucesso (Admin)! O saldo de ${nomeAlunoAlterar.value} foi alterado para ${valorExato.value}.`
                            await buscarMoedas()
                        } else {
                            mensagem.value = "Erro: Senha de Admin inválida ou falha na API."
                        }
                    } catch (erro) {
                        console.error("Erro no POST protegido:", erro)
                        mensagem.value = "Erro de conexão ao alterar."
                    }
                }

                // Executa o GET ao carregar a página
                onMounted(() => {
                    buscarMoedas()
                })

                return {
                    moedas,
                    nomeAluno,
                    quantidade,
                    mensagem,
                    nomeAlunoAlterar,
                    valorExato,
                    adminAuth,
                    buscarMoedas,
                    atualizarMoedas,
                    alterarPontosDireto
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
