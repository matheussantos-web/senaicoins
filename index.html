<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Testes - API FreeOnlineStorage & Supabase</title>

    <!-- IMPORTAÇÃO DO VUE.JS 3 VIA CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-get { background-color: #007BFF; }
        .btn-post { background-color: #28a745; }
        .btn-admin { background-color: #dc3545; }

        input, select {
            padding: 6px;
            margin-right: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* ESTILO MINIMALISTA PARA A LISTA DE ALUNOS */
        .lista-minimalista {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
            border-top: 1px solid #eee;
        }

        .item-lista {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 4px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #333;
        }

        .item-lista span:last-child {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div id="app" class="container">
        <h2>🎮 SENAICOINS</h2>
        <p><strong>Bucket:</strong> senai | <strong>Chave:</strong> coins</p>

        <hr style="margin: 20px 0;">

        <!-- LISTAGEM DOS ALUNOS DO SUPABASE E SEUS PONTOS (GET) - MINIMALISTA -->
        <div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">📊 Saldo de SENAICOINS</h3>
                <button @click="atualizarTudo" class="btn-get">Atualizar Dados</button>
            </div>
            
            <div style="margin-top: 15px;">
                <p v-if="alunosComCurriculo.length === 0" style="color: #666; font-size: 13px;">Carregando alunos do banco de dados...</p>
                
                <ul class="lista-minimalista">
                    <li v-for="aluno in alunosComCurriculo" :key="aluno" class="item-lista">
                        <span><strong>{{ aluno }}</strong></span>
                        <span>{{ moedas[aluno] !== undefined ? moedas[aluno] : 0 }} moedas</span>
                    </li>
                </ul>
            </div>
        </div>

        <hr style="margin: 20px 0;">

        <!-- ÁREA RESTRITA DO PROFESSOR (ADMIN) -->
        <div style="margin-top: 20px; border-top: 2px solid #dc3545; padding-top: 15px; background: #fff8f8; padding: 15px; border-radius: 6px;">
            <h3 style="color: #dc3545;">🔒 Área Restrita (Admin)</h3>
            <div style="margin-bottom: 10px;">
                <label>Senha Admin: </label>
                <input v-model="adminAuth" type="password" placeholder="Senha do .env">
            </div>
            <div style="margin-bottom: 10px;">
                <label>Aluno: </label>
                <select v-model="alunoAlterar">
                    <option disabled value="">Escolha um aluno...</option>
                    <option v-for="aluno in alunosComCurriculo" :value="aluno">{{ aluno }}</option>
                </select>
            </div>
            <div style="margin-bottom: 10px;">
                <label>Novo Saldo Exato: </label>
                <input v-model.number="valorExato" type="number">
            </div>
            <button @click="alterarPontosDireto" class="btn-admin">Definir Saldo Exato</button>
        </div>

        <!-- Feedback -->
        <p v-if="mensagem" style="margin-top: 20px; font-weight: bold; color: #333;">{{ mensagem }}</p>
    </div>

    <!-- SCRIPT DA APLICAÇÃO VUE -->
    <script>
        const { createApp, ref, onMounted } = Vue

        createApp({
            setup() {
                const baseUrl = "https://onlinestorage.you.tec.br/api"
                const bucket = "senai"
                const key = "coins"

                const supabaseUrl = "https://eempgprspimlhzlofvjx.supabase.co"
                const supabaseKey = "sb_publishable_H8eepB7xyJndr_TdsvuiVw_pJbsPC5k"

                const alunosComCurriculo = ref([])
                const moedas = ref({})
                const mensagem = ref("")

                const alunoAlterar = ref("")
                const valorExato = ref(0)
                const adminAuth = ref("")

                // 1. Buscar alunos no Supabase
                async function buscarAlunosSupabase() {
                    try {
                        const resposta = await fetch(`${supabaseUrl}/rest/v1/aluno?select=nome`, {
                            method: "GET",
                            headers: {
                                "apikey": supabaseKey,
                                "Authorization": `Bearer ${supabaseKey}`,
                                "Accept": "application/json"
                            }
                        })

                        if (resposta.ok) {
                            const dados = await resposta.json()
                            alunosComCurriculo.value = dados.map(item => item.nome)
                        } else {
                            console.error("Erro ao buscar alunos do Supabase")
                        }
                    } catch (erro) {
                        console.error("Erro de conexão com o Supabase:", erro)
                    }
                }

                // 2. Buscar moedas na API
                async function buscarMoedas() {
                    try {
                        const resposta = await fetch(`${baseUrl}/getkey/${bucket}/${key}`, {
                            method: "GET",
                            headers: { "Accept": "application/json" }
                        })

                        if (!resposta.ok) {
                            moedas.value = {}
                            return
                        }
                        const dados = await resposta.json()
                        moedas.value = dados.value || {}
                    } catch (erro) {
                        console.error("Erro no GET:", erro)
                    }
                }

                // 3. Sincronizar: Se o aluno do Supabase não estiver na API, cadastra com 0
                async function sincronizarAlunosNaApi() {
                    let dadosAtuais = { ...moedas.value }
                    let houveAlteracao = false

                    // Varre todos os alunos que vieram do Supabase
                    for (const aluno of alunosComCurriculo.value) {
                        // Se o aluno ainda não existe na chave coins da API
                        if (dadosAtuais[aluno] === undefined) {
                            dadosAtuais[aluno] = 0 // Define 0 como padrão
                            houveAlteracao = true
                        }
                    }

                    // Se encontrou algum aluno novo que não estava na API, faz o POST para salvar
                    if (houveAlteracao) {
                        try {
                            await fetch(`${baseUrl}/`, {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    "Accept": "application/json"
                                },
                                body: JSON.stringify({ bucket, key, value: dadosAtuais })
                            })
                            // Atualiza localmente após salvar
                            moedas.value = dadosAtuais
                        } catch (erro) {
                            console.error("Erro ao sincronizar novos alunos na API:", erro)
                        }
                    }
                }

                // Fluxo completo de atualização
                async function atualizarTudo() {
                    mensagem.value = "Sincronizando com Supabase e API..."
                    await buscarAlunosSupabase()
                    await buscarMoedas()
                    await sincronizarAlunosNaApi()
                    mensagem.value = "Dados atualizados com sucesso!"
                }

                // Função de admin para alterar pontos exatos
                async function alterarPontosDireto() {
                    if (!adminAuth.value || !alunoAlterar.value) {
                        alert("Preencha a senha de admin e selecione o aluno!")
                        return
                    }

                    let dadosAtuais = { ...moedas.value }
                    dadosAtuais[alunoAlterar.value] = Number(valorExato.value)

                    try {
                        const resposta = await fetch(`${baseUrl}/`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                                "Accept": "application/json",
                                "admin-auth": adminAuth.value
                            },
                            body: JSON.stringify({ bucket, key, value: dadosAtuais })
                        })

                        if (resposta.ok) {
                            mensagem.value = `Saldo de ${alunoAlterar.value} alterado para ${valorExato.value} (Admin).`
                            await buscarMoedas()
                        } else {
                            mensagem.value = "Senha de Admin inválida ou erro na API."
                        }
                    } catch (erro) {
                        console.error("Erro no POST protegido:", erro)
                    }
                }

                onMounted(async () => {
                    await atualizarTudo()
                })

                return {
                    alunosComCurriculo,
                    moedas,
                    mensagem,
                    alunoAlterar,
                    valorExato,
                    adminAuth,
                    atualizarTudo,
                    alterarPontosDireto
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
